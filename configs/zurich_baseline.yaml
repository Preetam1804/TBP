# Baseline pipeline configuration for Zurich Urban MAV dataset (ETH RPG)
# Note: Zurich dataset dev runs process 150-300 contiguous images.
# All outputs are labeled "replayed public dataset".

data_dir: "./data"
dataset_label: "replayed public dataset (Zurich Urban MAV) — not field-flight validation"

source:
  type: "zurich"
  dataset_dir: "data/raw/zurich_mav"
  start_id: 0
  count: 250
  stride: 1

ingest:
  source_type: "zurich"
  start_frame: 0
  max_frames: 300

keyframes:
  strategy: "laplacian_variance"
  stride: 2
  max_frames: 250
  min_blur: 60.0
  max_clipping: 0.05
  max_gap: 15
  orb_features: 2000

sfm:
  camera_model: "OPENCV"
  single_camera: true
  seq_overlap: 10
  max_image_size: 1600
  refine_intrinsics: false
  feature_type: "SIFT"
  matcher_type: "sequential"
  min_num_matches: 15
  init_min_inliers: 15
  init_min_tri_angle: 2.0
  abs_pose_min_inliers: 10

  # --- Video source intrinsics -------------------------------------------------
  # Video files carry no trustworthy intrinsics. A focal length is either supplied
  # explicitly (video_focal_px, or `uav3d sfm --focal-px`), which locks intrinsics,
  # or assumed from video_fov_deg and then refined.
  #
  # A refined camera is kept only if it stays physically plausible (implied FoV
  # inside the window below, near-isotropic focal lengths, principal point near
  # image center). If it fails, the run is redone with the supplied intrinsics
  # locked and the rejection is reported, rather than exporting an impossible
  # camera with a good-looking reprojection error.
  video_fov_deg: 60.0          # assumed horizontal FoV when no focal length is known
  video_focal_px: null         # explicit focal length in pixels; set to lock intrinsics
  video_min_fov_deg: 35.0      # lower credible horizontal FoV bound for refined cameras
  video_max_fov_deg: 100.0     # upper credible horizontal FoV bound for refined cameras
  allow_unbounded_intrinsics: false  # true = keep implausible refined intrinsics with a warning

sync:
  max_delta_us: 50000
  strategy: "nearest"

validation:
  alignment: "sim3"
  ate_threshold_meters: 5.0
