# Baseline pipeline configuration for Zurich Urban MAV dataset (ETH RPG)
# Note: Zurich dataset dev runs process 150-300 contiguous images.
# All outputs are labeled "replayed public dataset".

data_dir: "./data"
dataset_label: "replayed public dataset (Zurich Urban MAV) — not field-flight validation"

source:
  type: "zurich"
  dataset_dir: "data/raw/zurich_mav"
  start_id: 0
  count: 250
  stride: 1

ingest:
  source_type: "zurich"
  start_frame: 0
  max_frames: 300

keyframes:
  strategy: "laplacian_variance"
  stride: 2
  max_frames: 250
  min_blur: 60.0
  max_clipping: 0.05
  max_gap: 15
  orb_features: 2000
  # Note: keep video keyframe budgets <= sfm.exhaustive_max_images (default 120)
  # so exhaustive matching can capture the loop closures a forward flight lacks.

sfm:
  camera_model: "OPENCV"
  single_camera: true
  seq_overlap: 10
  max_image_size: 1600
  refine_intrinsics: false
  feature_type: "SIFT"
  matcher_type: "sequential"
  # Video runs (keyframes <= exhaustive_max_images) use video_matcher_type:
  # forward flight gives no loop closures, so sequential-only matching drops
  # the far end of the flight from the model.
  video_matcher_type: "exhaustive"
  exhaustive_max_images: 120
  loop_detection: false
  loop_detection_period: 10
  vocab_tree_path: null
  min_num_matches: 15
  init_min_inliers: 15
  init_min_tri_angle: 2.0
  abs_pose_min_inliers: 10
  # Single-model mode: stop after the main reconstruction. Prevents the slow
  # tail of "Discarding reconstruction due to insufficient size" attempts that
  # COLMAP makes when multiple_models is left on (can burn hours on leftovers).
  multiple_models: false
  init_num_trials: 200

sync:
  max_delta_us: 50000
  strategy: "nearest"

validation:
  alignment: "sim3"
  ate_threshold_meters: 5.0
