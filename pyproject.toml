[project]
name = "uav3d"
version = "0.1.0"
description = "Single-pass UAV video to 3D pipeline for SIH 26158 SP-1"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pycolmap==3.12.*",
    "opencv-python==4.10.*",
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "pyproj",
    "rich",
    "matplotlib",
]

# pip consumes [project.optional-dependencies]; uv consumes [dependency-groups].
# Both list the same tools on purpose: keep the two lists in sync when changing them.
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
uav3d = "uav3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 128
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# E501 is delegated to the formatter; the project uses a 128-column budget.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests exercise private helpers and long fixture literals by design.
"tests/*" = ["SIM", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "requires_dataset: test needs a real or generated dataset directory on disk",
]
